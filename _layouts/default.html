<!DOCTYPE html>
{% if page.url contains "/category" or page.url contains "/page" %}
    {% assign class = 'no-smooth-scroll' %}
{% endif %}
<html class="{{ class }}" lang="{{ page.lang | default: site.lang | default: "en" }}">
    {%- include head.html -%}
    <body>
        {%- include header.html -%}

        <div class="page-wrapper">
            <main id="main-content" aria-label="Content">
                {{ content }}
            </main>

            {%- include footer.html -%}
        </div>

        {% include js.html %}
        {% include google-analytics.html %}
    </body>
</html>
