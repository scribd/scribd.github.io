<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 500" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="The repeatable loop, ten steps: source documents in Databricks, standardize the document PDF and metadata, build JSONL batches, run batch inference with a fast model, store outputs with versioning, validate 1% and judge 0.1%, export disagreements to Google Sheets, SMEs review and correct labels, ingest corrections as the next golden dataset, improve prompts and repeat the loop back to building batches.">
  <defs>
    <marker id="wl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57617A"/>
    </marker>
    <marker id="wlY" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E47B01"/>
    </marker>
    <filter id="wlsh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1C263D" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1460" height="500" rx="20" fill="#F8F9FD"/>
  <text x="20" y="52" font-size="30" font-weight="700" fill="#1C263D">The repeatable loop</text>

  <!-- flow arrows -->
  <g stroke="#57617A" stroke-width="3" marker-end="url(#wl)">
    <line x1="280" y1="146" x2="307" y2="146"/>
    <line x1="570" y1="146" x2="597" y2="146"/>
    <line x1="860" y1="146" x2="887" y2="146"/>
    <line x1="1150" y1="146" x2="1177" y2="146"/>
    <!-- 5 -> 6 down -->
    <line x1="1310" y1="192" x2="1310" y2="337"/>
    <!-- row 2 right-to-left -->
    <line x1="1180" y1="386" x2="1153" y2="386"/>
    <line x1="890" y1="386" x2="863" y2="386"/>
    <line x1="600" y1="386" x2="573" y2="386"/>
    <line x1="310" y1="386" x2="283" y2="386"/>
  </g>

  <!-- loop: 10 -> 3 (improve prompts, repeat) -->
  <path d="M150,340 L150,266 L730,266 L730,195" fill="none" stroke="#ED8F02" stroke-width="3.2" marker-end="url(#wlY)"/>
  <text x="440" y="258" font-size="15" font-weight="600" fill="#B35F00" text-anchor="middle">repeat the loop</text>

  <!-- ===== Row 1 ===== -->
  <g filter="url(#wlsh)"><rect x="20" y="100" width="260" height="92" rx="14" fill="#E9EDF8" stroke="#CCD4E8" stroke-width="1.5"/></g>
  <text x="150" y="140" font-size="16" font-weight="700" fill="#1C263D" text-anchor="middle">1) Source documents</text>
  <text x="150" y="162" font-size="14" fill="#57617A" text-anchor="middle">in Databricks</text>

  <g filter="url(#wlsh)"><rect x="310" y="100" width="260" height="92" rx="14" fill="#E9EDF8" stroke="#CCD4E8" stroke-width="1.5"/></g>
  <text x="440" y="140" font-size="16" font-weight="700" fill="#1C263D" text-anchor="middle">2) Standardize document</text>
  <text x="440" y="162" font-size="14" fill="#57617A" text-anchor="middle">PDF + metadata</text>

  <g filter="url(#wlsh)"><rect x="600" y="100" width="260" height="92" rx="14" fill="#E9EDF8" stroke="#CCD4E8" stroke-width="1.5"/></g>
  <text x="730" y="140" font-size="16" font-weight="700" fill="#1C263D" text-anchor="middle">3) Build JSONL batches</text>
  <text x="730" y="162" font-size="14" fill="#57617A" text-anchor="middle">for LLM inference</text>

  <g filter="url(#wlsh)"><rect x="890" y="100" width="260" height="92" rx="14" fill="#1E7B85"/></g>
  <text x="1020" y="140" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4) Batch inference</text>
  <text x="1020" y="162" font-size="14" fill="#D3E7EA" text-anchor="middle">with a fast model</text>

  <g filter="url(#wlsh)"><rect x="1180" y="100" width="260" height="92" rx="14" fill="#E9EDF8" stroke="#CCD4E8" stroke-width="1.5"/></g>
  <text x="1310" y="140" font-size="16" font-weight="700" fill="#1C263D" text-anchor="middle">5) Store outputs</text>
  <text x="1310" y="162" font-size="14" fill="#57617A" text-anchor="middle">with versioning</text>

  <!-- ===== Row 2 (right to left) ===== -->
  <g filter="url(#wlsh)"><rect x="1180" y="340" width="260" height="92" rx="14" fill="#0D6069"/></g>
  <text x="1310" y="380" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">6) Validate 1%;</text>
  <text x="1310" y="402" font-size="14" fill="#CFE3E6" text-anchor="middle">judge 0.1% sample</text>

  <g filter="url(#wlsh)"><rect x="890" y="340" width="260" height="92" rx="14" fill="#E9EDF8" stroke="#CCD4E8" stroke-width="1.5"/></g>
  <text x="1020" y="380" font-size="16" font-weight="700" fill="#1C263D" text-anchor="middle">7) Export disagreements</text>
  <text x="1020" y="402" font-size="14" fill="#57617A" text-anchor="middle">to Google Sheets</text>

  <g filter="url(#wlsh)"><rect x="600" y="340" width="260" height="92" rx="14" fill="#A9085E"/></g>
  <text x="730" y="380" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">8) SMEs review &amp;</text>
  <text x="730" y="402" font-size="14" fill="#F3D3E3" text-anchor="middle">correct labels</text>

  <g filter="url(#wlsh)"><rect x="310" y="340" width="260" height="92" rx="14" fill="#02A793"/></g>
  <text x="440" y="380" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">9) Ingest corrections</text>
  <text x="440" y="402" font-size="14" fill="#D2F1EC" text-anchor="middle">next golden dataset</text>

  <g filter="url(#wlsh)"><rect x="20" y="340" width="260" height="92" rx="14" fill="#ED8F02"/></g>
  <text x="150" y="380" font-size="16" font-weight="700" fill="#1C263D" text-anchor="middle">10) Improve prompts</text>
  <text x="150" y="402" font-size="14" fill="#6B4200" text-anchor="middle">&amp; repeat the loop</text>
</svg>
