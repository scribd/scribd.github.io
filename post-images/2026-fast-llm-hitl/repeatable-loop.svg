<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 490" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="The repeatable loop: Fast Model, Judge Model, SME Review, Ingest, Iterate, looping back to the Fast Model.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57617A"/>
    </marker>
    <marker id="arrY" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E47B01"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1C263D" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1260" height="490" rx="20" fill="#F8F9FD"/>

  <text x="40" y="58" font-size="38" font-weight="700" fill="#1C263D">The repeatable loop</text>
  <text x="40" y="94" font-size="21" fill="#57617A">Breadth first with a fast model &#8212; then concentrate scarce human time where it matters.</text>

  <!-- loop-back arc (drawn first, behind nodes) -->
  <path d="M1120,278 C1120,432 140,432 140,278" fill="none" stroke="#ED8F02" stroke-width="3.5" marker-end="url(#arrY)"/>
  <text x="630" y="462" font-size="19" font-weight="600" fill="#B35F00" text-anchor="middle">Iterate: improve prompts, then re-run only the slices / disagreements that changed</text>

  <!-- flow arrows between nodes -->
  <g stroke="#57617A" stroke-width="3" marker-end="url(#arr)">
    <line x1="240" y1="219" x2="283" y2="219"/>
    <line x1="485" y1="219" x2="528" y2="219"/>
    <line x1="730" y1="219" x2="773" y2="219"/>
    <line x1="975" y1="219" x2="1018" y2="219"/>
  </g>

  <!-- nodes -->
  <!-- S1 Fast model -->
  <g filter="url(#sh)"><rect x="40" y="160" width="200" height="118" rx="16" fill="#1E7B85"/></g>
  <text x="140" y="206" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">Fast Model</text>
  <text x="140" y="234" font-size="15" fill="#D3E7EA" text-anchor="middle">batch: label + rationale</text>

  <!-- S2 Judge model -->
  <g filter="url(#sh)"><rect x="285" y="160" width="200" height="118" rx="16" fill="#0D6069"/></g>
  <text x="385" y="206" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">Judge Model</text>
  <text x="385" y="234" font-size="15" fill="#CFE3E6" text-anchor="middle">0.1% sample, agree/disagree</text>

  <!-- S3 SME review -->
  <g filter="url(#sh)"><rect x="530" y="160" width="200" height="118" rx="16" fill="#A9085E"/></g>
  <text x="630" y="206" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">SME Review</text>
  <text x="630" y="234" font-size="15" fill="#F3D3E3" text-anchor="middle">Google Sheets, final say</text>

  <!-- S4 Ingest -->
  <g filter="url(#sh)"><rect x="775" y="160" width="200" height="118" rx="16" fill="#02A793"/></g>
  <text x="875" y="206" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ingest</text>
  <text x="875" y="234" font-size="15" fill="#D2F1EC" text-anchor="middle">grow the golden set</text>

  <!-- S5 Iterate -->
  <g filter="url(#sh)"><rect x="1020" y="160" width="200" height="118" rx="16" fill="#ED8F02"/></g>
  <text x="1120" y="206" font-size="23" font-weight="700" fill="#1C263D" text-anchor="middle">Iterate</text>
  <text x="1120" y="234" font-size="15" fill="#6B4200" text-anchor="middle">versioned, measurable</text>
</svg>
