{% if paginator.total_pages > 1 %}
<nav class="pagination" aria-label="Page navigation">

    {% for page in (1..paginator.total_pages) %}
    {% if page == paginator.page %}
        <span class="current">{{ page }}</span>
    {% elsif page == 1 %}
        <a href="{{ paginator.previous_page_path | relative_url }}{{ site.post-id }}">{{ page }}</a>
    {% else %}
        <a href="{{ site.paginate_path | relative_url | replace: ':num', page }}{{ site.post-id }}">{{ page }}</a>
    {% endif %}
    {% endfor %}

    {% if paginator.next_page %}
        <a href="{{ paginator.next_page_path | relative_url }}{{ site.post-id }}" class="next-btn">Next &rarr;</a>
    {% endif %}

</nav>
{% endif %}
