{% assign hero = page.hero %}
<section class="page-headline">
    <div class="container">
        <div class="headline-inner">
            {% if hero.title %}
                <h1>{{ hero.title }}</h1>
            {% endif %}

            {% if hero.body %}
                <p class="headline-lead">{{ hero.body }}</p>
            {% endif %}
        </div>
    </div>
</section>
